name: Задача
description: Новая задача плана (A/E/B/S)
labels: []
body:
  - type: input
    id: code
    attributes:
      label: Код
      description: A-xx — дизайн, E-xx — фронтенд, B-xx — бэкенд, S-xx — инфраструктура и данные
      placeholder: B-18
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Задача
    validations:
      required: true
  - type: input
    id: result
    attributes:
      label: Результат
      description: Что будет видно, когда задача готова
    validations:
      required: true
  - type: input
    id: deps
    attributes:
      label: Зависит от
      placeholder: B-01, S-02 или —
  - type: markdown
    attributes:
      value: "Готово = PR смёржен, CI зелёный, работает на staging."
