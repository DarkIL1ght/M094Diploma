name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: "1. Открыть …\n2. Нажать …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось и получилось
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Где
      placeholder: staging / локально, браузер, телефон
