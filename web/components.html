<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Компоненты · ExamPrep</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/components.css">
    <link rel="stylesheet" href="/components-demo.css">
    <script type="module" src="/components-demo.js"></script>
  </head>
  <body>
    <main class="component-catalog">
      <a href="/">На главную</a>
      <h1>Базовые компоненты</h1>
      <div class="catalog-grid">
        <section class="catalog-section catalog-wide" aria-labelledby="title-buttons">
          <h2 id="title-buttons">Кнопки</h2>
          <div id="demo-buttons" class="catalog-stack"></div>
        </section>
        <section class="catalog-section" aria-labelledby="title-inputs">
          <h2 id="title-inputs">Поля ввода</h2>
          <div id="demo-inputs" class="catalog-stack"></div>
        </section>
        <section class="catalog-section" aria-labelledby="title-tabs">
          <h2 id="title-tabs">Вкладки</h2>
          <div id="demo-tabs"></div>
        </section>
        <section class="catalog-section catalog-wide" aria-labelledby="title-badges">
          <h2 id="title-badges">Бейджи</h2>
          <div id="demo-badges" class="catalog-row"></div>
        </section>
        <section class="catalog-section" aria-labelledby="title-toasts">
          <h2 id="title-toasts">Уведомления</h2>
          <div id="demo-toasts" class="catalog-stack"></div>
        </section>
        <section class="catalog-section" aria-labelledby="title-modals">
          <h2 id="title-modals">Диалоги</h2>
          <div id="demo-modals" class="catalog-row"></div>
        </section>
        <section class="catalog-section catalog-wide" aria-labelledby="title-skeletons">
          <h2 id="title-skeletons">Заглушки загрузки</h2>
          <div id="demo-skeletons" class="catalog-row catalog-skeletons"></div>
        </section>
      </div>
    </main>
  </body>
</html>
